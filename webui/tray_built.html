<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirPods 小助手 · 快捷菜单</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;color:#43351e;background:transparent;user-select:none}
body{padding:6px}.tray-card{height:100%;overflow:hidden;display:flex;flex-direction:column;padding:14px;background:linear-gradient(145deg,#fffef9,#fcf2e1 65%,#ead7bd);border:1px solid #fff;border-radius:25px;box-shadow:inset 0 1px 3px #fff,0 6px 14px #b59a7540;animation:enter .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
header{display:flex;align-items:center;gap:9px;padding:0 0 11px;border-bottom:1px solid #dcccaf80;margin-bottom:8px}
header img{width:37px;height:37px;border-radius:12px;box-shadow:0 2px 5px #8c70452c}header b{font-size:13px}header small{display:block;margin-top:3px;font-size:10px;color:#897751}
.status{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#e6b24d;box-shadow:0 0 5px #e6b24d90}.status[data-state=on]{background:#75b980;box-shadow:0 0 6px #75b98080}.status[data-state=busy]{background:#e6b24d;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;display:flex;align-items:center;text-align:left;gap:8px;padding:8px 10px;border-radius:12px;width:100%;font-size:12px;min-height:34px;transition:background .18s,transform .18s,box-shadow .18s}
button svg{width:19px;height:19px;flex:none;stroke:#986e34;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}button .chev{margin-left:auto;color:#a28a60;font-size:15px}
button:hover,button:focus-visible{background:#fff3cc;transform:translateX(2px);box-shadow:inset 0 1px 1px #fff,0 2px 8px #b38a4022;outline:none}button:active{transform:scale(.98)}
.primary{background:linear-gradient(#ffe49d,#ffcb53);font-weight:650;border:1px solid #fff1bd;margin-bottom:5px}.primary:hover{background:#ffda7c}
.sep{height:1px;background:#dbcaaf80;margin:5px 7px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding:3px 5px;color:#97815a;font-size:10px}.footer button{width:auto;min-height:24px;padding:3px 7px;font-size:10px}.check{margin-left:auto;color:#7a9d60;font-weight:700}.danger{color:#8d4840}.danger svg{stroke:#a55d52}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
